[build]
  dockerfile = "Dockerfile"

[[services]]
  name = "backend"
  command = "sh -c 'python -m uvicorn src.server:app --host 0.0.0.0 --port ${PORT:-8000}'"
  startup_timeout = 120

[[services]]
  name = "bot"
  command = "node --experimental-strip-types src/index.ts"
  startup_timeout = 120

[vendor]
  category = "python"
