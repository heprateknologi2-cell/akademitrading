name: Deploy Akademitrading

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend deps
        run: |
          cd apps/web
          npm ci

      - name: Install bot deps
        run: |
          cd apps/bot
          npm ci

      - name: Install Python deps
        run: |
          cd packages/data-engine
          pip install -r requirements.txt

      - name: Build frontend
        run: |
          cd apps/web
          npm run build

      - name: Typecheck
        run: |
          cd apps/web
          npx tsc --noEmit

      - name: Lint
        run: |
          cd apps/web
          npm run lint

  deploy-netlify:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build frontend
        run: |
          cd apps/web
          npm ci
          npm run build

      - name: Deploy to Netlify
        uses: netlify/actions-cli@v1
        with:
          args: deploy --prod --dir=apps/web/.next
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  deploy-railway-backend:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway
        run: |
          echo "Railway deploy triggered by push to main"
          echo "Connect this repo to Railway manually on railway.app"
          echo "Backend service will auto-deploy on git push"
