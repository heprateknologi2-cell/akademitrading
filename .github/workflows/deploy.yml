name: Deploy Akademitrading

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend deps
        run: |
          cd apps/web
          npm ci

      - name: Install bot deps
        run: |
          cd apps/bot
          npm ci

      - name: Install Python deps
        run: |
          cd packages/data-engine
          pip install -r requirements.txt

      - name: Build frontend
        run: |
          cd apps/web
          npm run build

      - name: Typecheck
        run: |
          cd apps/web
          npx tsc --noEmit

      - name: Lint
        run: |
          cd apps/web
          npm run lint

# Frontend deploy: Netlify auto-deploys via its own GitHub webhook + netlify.toml
# Backend deploy: Railway auto-deploys via its own GitHub webhook (service: packages/data-engine)
# No manual deploy step needed here — build-and-test is the CI gate.
